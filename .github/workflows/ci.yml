name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend-springboot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend-springboot/pom.xml') }}
          restore-keys: |
            maven-

      - name: Build and run tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache web-client dependencies
        uses: actions/cache@v4
        with:
          path: web-client/node_modules
          key: web-${{ hashFiles('web-client/package-lock.json') }}

      - name: Cache admin-console dependencies
        uses: actions/cache@v4
        with:
          path: admin-console/node_modules
          key: admin-${{ hashFiles('admin-console/package-lock.json') }}

      - name: Build web-client
        working-directory: web-client
        run: |
          npm ci
          npm run build

      - name: Build admin-console
        working-directory: admin-console
        run: |
          npm ci
          npm run build
