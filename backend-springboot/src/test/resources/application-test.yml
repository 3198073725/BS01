spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 3025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: test-secret-key-for-unit-testing-min-256-bits-long-enough
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000
  video:
    max-size-bytes: 524288000
    allowed-extensions: .mp4,.mov,.m4v,.webm,.mkv
  upload:
    dir: ./test-media
    chunk-size: 8388608
  contact:
    email-to: test@example.com
  config:
    cache-ttl-seconds: 0
  rate-limit:
    enabled: false
