# Shared security response headers for nginx
# Include via: include /etc/nginx/security-headers.conf;
# Note: nginx resets add_header on include sites; include this file in every
# location that already declares its own add_header (media/static caching).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
