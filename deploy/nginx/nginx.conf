# VidSprout production nginx - single entry point
#   /         -> web-client (user-facing SPA)
#   /admin/   -> admin-console SPA
#   /api/     -> Spring Boot backend (reverse proxy)
#   /media/   -> backend media files (proxy)
#   /ws/      -> backend WebSocket (proxy)
#
# HTTPS 启用步骤:
#   1. 申请证书后放入 deploy/nginx/ssl/（server.crt / server.key）
#   2. 在 docker-compose.yml 的 web 服务挂载 ssl 卷
#   3. 取消下方 HTTP->HTTPS 跳转块与 HTTPS server 块的注释

# 取消注释以下块即可启用 HTTP -> HTTPS 跳转
# server {
#     listen 80;
#     listen [::]:80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 与后端 multipart 512MB 上限对齐
    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html/web;
    index index.html;

    # ---- admin-console SPA（构建基址为 /admin/）
    # 使用 ^~ 避免被下方资源正则 location 拦截
    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /admin/index.html;

        # admin 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            include /etc/nginx/security-headers.conf;
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # ---- web-client SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- backend API ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # ---- media files (backend serves /media/**) ----
    # ^~ 前缀匹配优先于正则，避免 .jpg/.mp4 落入下方静态资源正则而 404
    location ^~ /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        include /etc/nginx/security-headers.conf;
        add_header Accept-Ranges bytes;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- WebSocket ----
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # ---- web static asset caching ----
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        include /etc/nginx/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

